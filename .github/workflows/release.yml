name: Build and release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build x86 DLL and publish release
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      - name: Configure CMake
        # MinHook still declares CMake 3.0 compatibility, which CMake 4 no longer supports.
        run: cmake -S . -B build -A Win32 -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build Ormenos
        run: cmake --build build --config Release --target Ormenos

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          $tag = "main-$($env:GITHUB_SHA)"
          $asset = "build/Release/dinput8.dll"

          if (-not (Test-Path $asset)) {
            throw "Expected build output was not found: $asset"
          }

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag "$asset#dinput8.dll" --clobber
          } else {
            gh release create $tag "$asset#dinput8.dll" `
              --target $env:GITHUB_SHA `
              --title "Ormenos $shortSha" `
              --notes "Automated release from main at commit $env:GITHUB_SHA." `
              --latest
          }
